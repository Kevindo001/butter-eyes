<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1180" width="1800" height="1180" font-family="Helvetica, Arial, sans-serif"><rect width="1800" height="1180" fill="#faf9f7"/><text x="40" y="52" font-size="34" font-weight="800" fill="#1f1a17" text-anchor="start">Butter: wiring schematic</text><text x="40" y="82" font-size="17" font-weight="400" fill="#5a524c" text-anchor="start">Jetson Orin Nano Super · 2 × L298N motor drivers · 4 mecanum wheels · 3S LiPo. Pin numbers are the 40-pin header (BOARD numbering).</text><rect x="700" y="330" width="400" height="470" fill="#fff" stroke="#1f1a17" stroke-width="2"/><rect x="700" y="330" width="400" height="44" fill="#1f1a17" stroke="#1f1a17" stroke-width="2"/><text x="900.0" y="360" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">NVIDIA Jetson Orin Nano Super (8 GB)</text><text x="900.0" y="406" font-size="15" font-weight="400" fill="#5a524c" text-anchor="middle">40-pin header, 3.3 V logic</text><rect x="260" y="330" width="250" height="470" fill="#fff" stroke="#1f1a17" stroke-width="2"/><rect x="260" y="330" width="250" height="44" fill="#3d3530" stroke="#1f1a17" stroke-width="2"/><text x="385.0" y="360" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">L298N driver: LEFT side</text><text x="385.0" y="406" font-size="14" font-weight="400" fill="#5a524c" text-anchor="middle">enable jumpers removed</text><rect x="1290" y="330" width="250" height="470" fill="#fff" stroke="#1f1a17" stroke-width="2"/><rect x="1290" y="330" width="250" height="44" fill="#3d3530" stroke="#1f1a17" stroke-width="2"/><text x="1415.0" y="360" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">L298N driver: RIGHT side</text><text x="1415.0" y="406" font-size="14" font-weight="400" fill="#5a524c" text-anchor="middle">enable jumpers removed</text><rect x="700" y="425" width="62" height="30" fill="#d1495b" stroke="#d1495b" stroke-width="2"/><text x="731" y="445" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">11</text><text x="772" y="445" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="start">LF IN1</text><polyline points="700,440 510,440" fill="none" stroke="#d1495b" stroke-width="4" stroke-linejoin="miter"/><rect x="505" y="435" width="10" height="10" fill="#d1495b"/><text x="498" y="445" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">IN1</text><rect x="700" y="471" width="62" height="30" fill="#d1495b" stroke="#d1495b" stroke-width="2"/><text x="731" y="491" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">13</text><text x="772" y="491" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="start">LF IN2</text><polyline points="700,486 510,486" fill="none" stroke="#d1495b" stroke-width="4" stroke-linejoin="miter"/><rect x="505" y="481" width="10" height="10" fill="#d1495b"/><text x="498" y="491" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">IN2</text><rect x="700" y="517" width="62" height="30" fill="#e09f3e" stroke="#e09f3e" stroke-width="2"/><text x="731" y="537" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">16</text><text x="772" y="537" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="start">LR IN1</text><polyline points="700,532 510,532" fill="none" stroke="#e09f3e" stroke-width="4" stroke-linejoin="miter"/><rect x="505" y="527" width="10" height="10" fill="#e09f3e"/><text x="498" y="537" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">IN3</text><rect x="700" y="563" width="62" height="30" fill="#e09f3e" stroke="#e09f3e" stroke-width="2"/><text x="731" y="583" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">15</text><text x="772" y="583" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="start">LR IN2</text><polyline points="700,578 510,578" fill="none" stroke="#e09f3e" stroke-width="4" stroke-linejoin="miter"/><rect x="505" y="573" width="10" height="10" fill="#e09f3e"/><text x="498" y="583" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">IN4</text><rect x="700" y="609" width="62" height="30" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="2"/><text x="731" y="629" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">12</text><text x="772" y="629" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="start">Left ENA</text><polyline points="700,624 510,624" fill="none" stroke="#7b5ea7" stroke-width="4" stroke-linejoin="miter"/><rect x="505" y="619" width="10" height="10" fill="#7b5ea7"/><text x="498" y="629" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">ENA</text><rect x="700" y="655" width="62" height="30" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="2"/><text x="731" y="675" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">35</text><text x="772" y="675" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="start">Left ENB</text><polyline points="700,670 510,670" fill="none" stroke="#7b5ea7" stroke-width="4" stroke-linejoin="miter"/><rect x="505" y="665" width="10" height="10" fill="#7b5ea7"/><text x="498" y="675" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">ENB</text><rect x="700" y="701" width="62" height="30" fill="#222" stroke="#222" stroke-width="2"/><text x="731" y="721" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">GND</text><text x="772" y="721" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="start">Ground</text><polyline points="700,716 510,716" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="miter"/><rect x="505" y="711" width="10" height="10" fill="#222"/><text x="498" y="721" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">GND</text><rect x="1038" y="425" width="62" height="30" fill="#2a9d8f" stroke="#2a9d8f" stroke-width="2"/><text x="1069" y="445" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">33</text><text x="1028" y="445" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="end">RF IN1</text><polyline points="1100,440 1290,440" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linejoin="miter"/><rect x="1285" y="435" width="10" height="10" fill="#2a9d8f"/><text x="1302" y="445" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">IN1</text><rect x="1038" y="471" width="62" height="30" fill="#2a9d8f" stroke="#2a9d8f" stroke-width="2"/><text x="1069" y="491" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">31</text><text x="1028" y="491" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="end">RF IN2</text><polyline points="1100,486 1290,486" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linejoin="miter"/><rect x="1285" y="481" width="10" height="10" fill="#2a9d8f"/><text x="1302" y="491" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">IN2</text><rect x="1038" y="517" width="62" height="30" fill="#3a6ea5" stroke="#3a6ea5" stroke-width="2"/><text x="1069" y="537" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">29</text><text x="1028" y="537" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="end">RR IN1</text><polyline points="1100,532 1290,532" fill="none" stroke="#3a6ea5" stroke-width="4" stroke-linejoin="miter"/><rect x="1285" y="527" width="10" height="10" fill="#3a6ea5"/><text x="1302" y="537" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">IN3</text><rect x="1038" y="563" width="62" height="30" fill="#3a6ea5" stroke="#3a6ea5" stroke-width="2"/><text x="1069" y="583" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">18</text><text x="1028" y="583" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="end">RR IN2</text><polyline points="1100,578 1290,578" fill="none" stroke="#3a6ea5" stroke-width="4" stroke-linejoin="miter"/><rect x="1285" y="573" width="10" height="10" fill="#3a6ea5"/><text x="1302" y="583" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">IN4</text><rect x="1038" y="609" width="62" height="30" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="2"/><text x="1069" y="629" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="1028" y="629" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="end">Right ENA</text><polyline points="1100,624 1290,624" fill="none" stroke="#7b5ea7" stroke-width="4" stroke-linejoin="miter"/><rect x="1285" y="619" width="10" height="10" fill="#7b5ea7"/><text x="1302" y="629" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">ENA</text><rect x="1038" y="655" width="62" height="30" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="2"/><text x="1069" y="675" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">32</text><text x="1028" y="675" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="end">Right ENB</text><polyline points="1100,670 1290,670" fill="none" stroke="#7b5ea7" stroke-width="4" stroke-linejoin="miter"/><rect x="1285" y="665" width="10" height="10" fill="#7b5ea7"/><text x="1302" y="675" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">ENB</text><rect x="1038" y="701" width="62" height="30" fill="#222" stroke="#222" stroke-width="2"/><text x="1069" y="721" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">GND</text><text x="1028" y="721" font-size="14" font-weight="400" fill="#1f1a17" text-anchor="end">Ground</text><polyline points="1100,716 1290,716" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="miter"/><rect x="1285" y="711" width="10" height="10" fill="#222"/><text x="1302" y="721" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">GND</text><rect x="50" y="410" width="150" height="92" fill="#fff" stroke="#d1495b" stroke-width="4"/><text x="125" y="448" font-size="17" font-weight="800" fill="#1f1a17" text-anchor="middle">Left Front (LF)</text><text x="125" y="472" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">DC gear motor</text><text x="125" y="490" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">mecanum wheel</text><rect x="50" y="582" width="150" height="92" fill="#fff" stroke="#e09f3e" stroke-width="4"/><text x="125" y="620" font-size="17" font-weight="800" fill="#1f1a17" text-anchor="middle">Left Rear (LR)</text><text x="125" y="644" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">DC gear motor</text><text x="125" y="662" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">mecanum wheel</text><rect x="1600" y="410" width="150" height="92" fill="#fff" stroke="#2a9d8f" stroke-width="4"/><text x="1675" y="448" font-size="17" font-weight="800" fill="#1f1a17" text-anchor="middle">Right Front (RF)</text><text x="1675" y="472" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">DC gear motor</text><text x="1675" y="490" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">mecanum wheel</text><rect x="1600" y="582" width="150" height="92" fill="#fff" stroke="#3a6ea5" stroke-width="4"/><text x="1675" y="620" font-size="17" font-weight="800" fill="#1f1a17" text-anchor="middle">Right Rear (RR)</text><text x="1675" y="644" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">DC gear motor</text><text x="1675" y="662" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">mecanum wheel</text><polyline points="200,448 260,448" fill="none" stroke="#d1495b" stroke-width="4" stroke-linejoin="miter"/><polyline points="200,464 260,464" fill="none" stroke="#d1495b" stroke-width="4" stroke-linejoin="miter"/><text x="272" y="461" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">OUT1 / OUT2</text><polyline points="200,620 260,620" fill="none" stroke="#e09f3e" stroke-width="4" stroke-linejoin="miter"/><polyline points="200,636 260,636" fill="none" stroke="#e09f3e" stroke-width="4" stroke-linejoin="miter"/><text x="272" y="633" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">OUT3 / OUT4</text><polyline points="1540,448 1600,448" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linejoin="miter"/><polyline points="1540,464 1600,464" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linejoin="miter"/><text x="1528" y="461" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">OUT1 / OUT2</text><polyline points="1540,620 1600,620" fill="none" stroke="#3a6ea5" stroke-width="4" stroke-linejoin="miter"/><polyline points="1540,636 1600,636" fill="none" stroke="#3a6ea5" stroke-width="4" stroke-linejoin="miter"/><text x="1528" y="633" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">OUT3 / OUT4</text><text x="272" y="742" font-size="14" font-weight="700" fill="#c0392b" text-anchor="start">+12 V in  (motor power)</text><text x="272" y="766" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="start">GND</text><text x="1528" y="742" font-size="14" font-weight="700" fill="#c0392b" text-anchor="end">+12 V in  (motor power)</text><text x="1528" y="766" font-size="14" font-weight="700" fill="#1f1a17" text-anchor="end">GND</text><rect x="760" y="130" width="280" height="84" fill="#fff" stroke="#c0392b" stroke-width="4"/><text x="900" y="166" font-size="20" font-weight="800" fill="#1f1a17" text-anchor="middle">3S LiPo battery</text><text x="900" y="192" font-size="14" font-weight="400" fill="#5a524c" text-anchor="middle">11.1 V nominal · EC5 connector</text><rect x="820" y="250" width="160" height="44" fill="#fff" stroke="#c0392b" stroke-width="3"/><text x="900" y="278" font-size="15" font-weight="700" fill="#1f1a17" text-anchor="middle">EC5 Y-harness</text><polyline points="900,214 900,250" fill="none" stroke="#c0392b" stroke-width="5" stroke-linejoin="miter"/><polyline points="900,294 900,330" fill="none" stroke="#c0392b" stroke-width="5" stroke-linejoin="miter" stroke-dasharray="10 7"/><text x="912" y="320" font-size="13" font-weight="400" fill="#c0392b" text-anchor="start">Jetson power in</text><polyline points="820,272 385.0,272 385.0,330" fill="none" stroke="#c0392b" stroke-width="5" stroke-linejoin="miter" stroke-dasharray="10 7"/><polyline points="980,272 1415.0,272 1415.0,330" fill="none" stroke="#c0392b" stroke-width="5" stroke-linejoin="miter" stroke-dasharray="10 7"/><text x="397.0" y="262" font-size="13" font-weight="400" fill="#c0392b" text-anchor="start">motor power to both drivers</text><rect x="1180" y="96" width="580" height="160" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/><text x="1196" y="120" font-size="15" font-weight="700" fill="#7a5a00" text-anchor="start">Confirmed vs. to check</text><text x="1196" y="206" font-size="13" font-weight="400" fill="#7a5a00" text-anchor="start">Driver terminal names (IN1-IN4, OUT1-OUT4) follow the usual L298N layout.</text><text x="1196" y="224" font-size="13" font-weight="400" fill="#7a5a00" text-anchor="start">The Jetson pin for each wheel is confirmed by test; the terminal</text><text x="1196" y="242" font-size="13" font-weight="400" fill="#7a5a00" text-anchor="start">letters on the driver boards are not.</text><text x="1196" y="142" font-size="13" font-weight="400" fill="#7a5a00" text-anchor="start">Dashed red = power. Battery, Y-harness and both drivers are confirmed.</text><text x="1196" y="160" font-size="13" font-weight="400" fill="#7a5a00" text-anchor="start">Which branch feeds what (and any regulator in between) is not written</text><text x="1196" y="178" font-size="13" font-weight="400" fill="#7a5a00" text-anchor="start">down anywhere: check it on the robot before calling this final.</text><polyline points="790,800 790,870" fill="none" stroke="#666" stroke-width="4" stroke-linejoin="miter"/><polyline points="900,800 900,870" fill="none" stroke="#666" stroke-width="4" stroke-linejoin="miter"/><polyline points="1020,800 1020,870" fill="none" stroke="#888" stroke-width="4" stroke-linejoin="miter" stroke-dasharray="4 6"/><rect x="640" y="870" width="220" height="80" fill="#fff" stroke="#666" stroke-width="3"/><text x="750" y="902" font-size="16" font-weight="800" fill="#1f1a17" text-anchor="middle">USB webcam</text><text x="750" y="926" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">Butter's forward view</text><rect x="875" y="870" width="210" height="80" fill="#fff" stroke="#666" stroke-width="3"/><text x="980" y="902" font-size="16" font-weight="800" fill="#1f1a17" text-anchor="middle">USB audio adapter</text><text x="980" y="926" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">+ speaker (Butter's voice)</text><text x="798" y="824" font-size="13" font-weight="700" fill="#666" text-anchor="start">USB</text><text x="908" y="824" font-size="13" font-weight="700" fill="#666" text-anchor="start">USB</text><text x="1028" y="824" font-size="13" font-weight="700" fill="#888" text-anchor="start">Wi-Fi</text><rect x="1100" y="870" width="330" height="80" fill="#fff" stroke="#1f1a17" stroke-width="3"/><text x="1265" y="902" font-size="16" font-weight="800" fill="#1f1a17" text-anchor="middle">Laptop running BLINC</text><text x="1265" y="926" font-size="13" font-weight="400" fill="#5a524c" text-anchor="middle">commands in, camera video out</text><polyline points="1020,848 1140,848 1140,870" fill="none" stroke="#888" stroke-width="4" stroke-linejoin="miter" stroke-dasharray="4 6"/><text x="1445" y="898" font-size="13" font-weight="400" fill="#5a524c" text-anchor="start">Port 8770: drive commands (WebSocket)</text><text x="1445" y="918" font-size="13" font-weight="400" fill="#5a524c" text-anchor="start">Port 5600: camera stream</text><text x="1445" y="938" font-size="13" font-weight="700" fill="#5a524c" text-anchor="start">Stops if no command for 450 ms</text><rect x="40" y="860" width="560" height="250" fill="#fff" stroke="#cfc7bf" stroke-width="2"/><text x="58" y="890" font-size="17" font-weight="800" fill="#1f1a17" text-anchor="start">How a wheel is driven</text><text x="58" y="922" font-size="14" font-weight="400" fill="#3d3530" text-anchor="start">Forward: IN2 high, IN1 low.   Reverse: IN1 high, IN2 low.   Stop: both low.</text><text x="58" y="948" font-size="14" font-weight="400" fill="#3d3530" text-anchor="start">Speed: the Jetson pulses the ENA / ENB pins (software PWM, 50 Hz).</text><text x="58" y="974" font-size="14" font-weight="400" fill="#3d3530" text-anchor="start">Left Rear is wired reversed on the chassis; its two pins are swapped</text><text x="58" y="1000" font-size="14" font-weight="400" fill="#3d3530" text-anchor="start">in software (16, 15) instead of re-wiring.</text><text x="58" y="1026" font-size="14" font-weight="400" fill="#3d3530" text-anchor="start">Grounds are common: Jetson GND, both driver GNDs and battery negative.</text><text x="58" y="1052" font-size="14" font-weight="400" fill="#3d3530" text-anchor="start">A boot service puts these header pins into GPIO mode (butter-pinmux).</text><rect x="58" y="1076" width="16" height="16" fill="#d1495b" stroke="#d1495b" stroke-width="2"/><text x="80" y="1089" font-size="12" font-weight="400" fill="#1f1a17" text-anchor="start">Left Front</text><rect x="166" y="1076" width="16" height="16" fill="#e09f3e" stroke="#e09f3e" stroke-width="2"/><text x="188" y="1089" font-size="12" font-weight="400" fill="#1f1a17" text-anchor="start">Left Rear</text><rect x="274" y="1076" width="16" height="16" fill="#2a9d8f" stroke="#2a9d8f" stroke-width="2"/><text x="296" y="1089" font-size="12" font-weight="400" fill="#1f1a17" text-anchor="start">Right Front</text><rect x="382" y="1076" width="16" height="16" fill="#3a6ea5" stroke="#3a6ea5" stroke-width="2"/><text x="404" y="1089" font-size="12" font-weight="400" fill="#1f1a17" text-anchor="start">Right Rear</text><rect x="490" y="1076" width="16" height="16" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="2"/><text x="512" y="1089" font-size="12" font-weight="400" fill="#1f1a17" text-anchor="start">Enable / speed</text></svg>