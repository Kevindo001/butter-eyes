<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app: 'wasm-unsafe-eval'; img-src 'self' app: data: blob: http: https:; media-src 'self' app: blob: data: mediastream:; style-src 'self' app: 'unsafe-inline'; connect-src 'self' app: data: blob:; worker-src 'self' app: blob:" />
  <title>BLINC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" fill="var(--ink)"/>
        <path d="M7 13 Q20 4 33 13" fill="none" stroke="var(--lamp)" stroke-width="3.5" stroke-linecap="square"/>
        <path d="M6 25 Q20 13 34 25 Q20 37 6 25 Z" fill="#fff"/>
        <rect x="16" y="21" width="8" height="8" fill="var(--ink)"/>
      </svg>
      <div class="brandtext"><b>BLINC</b><small>Brow and Lid Input for Navigation and Conversation</small></div>
    </div>
    <div class="pills">
      <span class="pill status" id="pillFace"><i></i><b>No face</b></span>
      <span class="pill status" id="pillButter"><i></i><b>Butter offline</b></span>
      <span class="pill status" id="pillAi"><i></i><b>Voice + AI</b></span>
      <span class="pill note" id="pillMulti" hidden><i></i><b>Multiple faces detected</b></span>
      <span class="pill note" id="pillClose" hidden><i></i><b>Move closer</b></span>
      <span class="pill note" id="pillGlare" hidden><i></i><b>Glare on glasses</b></span>
      <span class="pill note" id="pillDrift" hidden><i></i><b>Recalibrate?</b></span>
      <span class="pill note" id="pillControl" hidden><i></i><b>Eye control off</b></span>
    </div>
    <button id="devBtn" class="devbtn" title="Raw face readings">Dev</button>
    <div class="hud">
      <span class="last" id="lastGesture"></span>
      <div class="eyes" id="bothRing" title="Your eyes, as BLINC sees them">
        <div class="eyeball" id="eyeL" title="left eye"><span></span></div>
        <div class="eyeball" id="eyeR" title="right eye"><span></span></div>
      </div>
      <div class="cam"><video id="video" playsinline muted></video><canvas id="camOverlay"></canvas></div>
    </div>
  </header>
  <main id="main"></main>
  <div id="toast" class="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
